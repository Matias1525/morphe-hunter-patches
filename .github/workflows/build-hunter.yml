name: Build and Release Hunter MPP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "hunter-v0.1.patch"
      - "VERSION"
      - ".github/workflows/build-hunter.yml"
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/MorpheApp/morphe-patches.git
      UPSTREAM_TAG: v1.44.0-dev.4
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Hunter project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Hunter version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone Morphe Patches
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_REPO" upstream

      - name: Apply Hunter patch
        run: |
          cd upstream
          git apply --check ../hunter-v0.1.patch
          git apply ../hunter-v0.1.patch
          echo "Applied Hunter patch to $UPSTREAM_TAG"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install Node dependencies
        working-directory: upstream
        run: npm ci

      - name: Make Gradle wrapper executable
        working-directory: upstream
        run: chmod +x gradlew

      - name: Build Morphe patch bundle
        working-directory: upstream
        run: |
          ./gradlew :patches:build :patches:generatePatchesList --stacktrace
          echo "---- Build outputs ----"
          find patches/build -maxdepth 4 -type f -print || true

      - name: Collect MPP
        run: |
          mkdir -p dist
          MPP="$(find upstream/patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          if [ -z "$MPP" ]; then
            echo "No .mpp bundle was produced."
            exit 1
          fi
          cp "$MPP" "dist/patches-hunter-v${{ steps.version.outputs.version }}.mpp"
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-hunter-v${{ steps.version.outputs.version }}-mpp
          path: dist/patches-hunter-v${{ steps.version.outputs.version }}.mpp
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FILE="dist/patches-hunter-v${{ steps.version.outputs.version }}.mpp"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "YouTube Hunter v${{ steps.version.outputs.version }}" \
              --notes "Experimental YouTube Hunter patch bundle for Morphe."
          fi

      - name: Refresh Morphe remote source metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/patches-hunter-v${VERSION}.mpp"

          cat > patches-bundle.json <<EOF
          {
            "created_at": "$CREATED_AT",
            "description": "YouTube Hunter Experimental patches for Morphe",
            "download_url": "$DOWNLOAD_URL",
            "signature_download_url": "",
            "version": "$VERSION"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json

          if git diff --cached --quiet; then
            echo "patches-bundle.json already current"
          else
            git commit -m "chore: update Morphe bundle metadata for v$VERSION"
            git push origin HEAD:main
          fi
