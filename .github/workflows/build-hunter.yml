name: Build and Release Hunter MPP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "hunter-v0.1.patch"
      - "VERSION"
      - ".github/workflows/build-hunter.yml"

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/MorpheApp/morphe-patches.git
      UPSTREAM_TAG: v1.44.0-dev.4
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Hunter project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Hunter version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone Morphe Patches
        shell: bash
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_REPO" upstream

      - name: Apply Hunter patch
        shell: bash
        run: |
          cd upstream
          git apply --check ../hunter-v0.1.patch
          git apply ../hunter-v0.1.patch

      - name: Brand and version Hunter bundle
        env:
          HUNTER_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          version = os.environ["HUNTER_VERSION"]

          props = Path("upstream/gradle.properties")
          s = props.read_text()
          s = re.sub(r"(?m)^version\s*=\s*.*$", f"version = {version}", s)
          props.write_text(s)

          build = Path("upstream/patches/build.gradle.kts")
          s = build.read_text()
          s = s.replace('name = "Morphe Patches"', 'name = "Morphe Hunter Patches"')
          s = s.replace('description = "Patches for Morphe"', 'description = "Morphe patches with YouTube Hunter Experimental"')
          s = s.replace('source = "git@github.com:MorpheApp/morphe-patches.git"', 'source = "https://github.com/Matias1525/morphe-hunter-patches"')
          s = s.replace('author = "MorpheApp"', 'author = "Matias1525 + MorpheApp"')
          build.write_text(s)
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install Node dependencies
        working-directory: upstream
        run: npm ci

      - name: Make Gradle executable
        working-directory: upstream
        run: chmod +x gradlew

      - name: Show relevant Gradle tasks
        working-directory: upstream
        shell: bash
        run: |
          ./gradlew :patches:tasks --all | grep -Ei 'publish|dex|mpp|bundle' || true

      - name: Build published runtime bundle
        working-directory: upstream
        shell: bash
        run: |
          ./gradlew :patches:publish --stacktrace
          find patches/build/libs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Collect and validate runtime MPP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MPP="upstream/patches/build/libs/patches-${VERSION}.mpp"
          OUT="dist/patches-hunter-v${VERSION}.mpp"

          mkdir -p dist
          if [ ! -f "$MPP" ]; then
            echo "Expected runtime bundle missing: $MPP"
            exit 1
          fi

          echo "=== Runtime MPP manifest ==="
          unzip -p "$MPP" META-INF/MANIFEST.MF || true
          echo "=== DEX entries ==="
          unzip -l "$MPP" | grep -Ei '\.dex$' || true

          if ! unzip -l "$MPP" | grep -qE 'classes([0-9]*)?\.dex$'; then
            echo "ERROR: MPP has no classes.dex. Not publishing a zero-patch bundle."
            exit 1
          fi

          cp "$MPP" "$OUT"
          ls -lh "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-hunter-v${{ steps.version.outputs.version }}-mpp
          path: dist/patches-hunter-v${{ steps.version.outputs.version }}.mpp
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          FILE="dist/patches-hunter-v${VERSION}.mpp"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE"               --title "YouTube Hunter v${VERSION}"               --notes "Experimental YouTube Hunter patch bundle for Morphe."
          fi

      - name: Refresh Morphe remote source metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/patches-hunter-v${VERSION}.mpp"

          cat > patches-bundle.json <<EOF
          {
            "created_at": "$CREATED_AT",
            "description": "YouTube Hunter Experimental patches for Morphe",
            "download_url": "$DOWNLOAD_URL",
            "signature_download_url": "",
            "version": "$VERSION"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update Morphe bundle metadata for v$VERSION [skip ci]"
            git push origin HEAD:main
          fi
