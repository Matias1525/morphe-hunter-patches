name: Build Hunter MPP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "hunter-v0.1.patch"
      - ".github/workflows/build-hunter.yml"
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/MorpheApp/morphe-patches.git
      UPSTREAM_TAG: v1.44.0-dev.4
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Hunter project
        uses: actions/checkout@v4

      - name: Clone Morphe Patches
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_REPO" upstream

      - name: Apply Hunter patch
        run: |
          cd upstream
          git apply --check ../hunter-v0.1.patch
          git apply ../hunter-v0.1.patch
          echo "Applied Hunter v0.1 patch to $UPSTREAM_TAG"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install Node dependencies
        working-directory: upstream
        run: npm ci

      - name: Make Gradle wrapper executable
        working-directory: upstream
        run: chmod +x gradlew

      - name: Build Morphe patch bundle
        working-directory: upstream
        run: |
          ./gradlew :patches:build :patches:generatePatchesList --stacktrace
          echo "---- Build outputs ----"
          find patches/build -maxdepth 4 -type f -print || true

      - name: Collect MPP
        run: |
          mkdir -p dist
          MPP="$(find upstream/patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          if [ -z "$MPP" ]; then
            echo "No .mpp bundle was produced."
            exit 1
          fi
          cp "$MPP" "dist/patches-hunter-v0.1.mpp"
          ls -lh dist/

      - name: Upload MPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-hunter-v0.1-mpp
          path: dist/patches-hunter-v0.1.mpp
          if-no-files-found: error
          retention-days: 30
